<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miso & More</title>
  <link rel="stylesheet" href="./src_/CSS/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

</head>

<body>
  <header>
    <div class="logo">
      <img src="./src_/img_/logoMiso.png" alt="Miso & More Logo">
    </div>
    <nav>
      <ul>
        <li><a href="./index.html" aria-current="page">Home</a></li>
        <li><a href="./src_/HTML/cardapio.html">Cardápio</a></li>
        <li><a href="./src_/HTML/quemSomos.html">Quem somos</a></li>
        <li><a href="./src_/HTML/contato.html">Contato</a></li>
      </ul>
    </nav>
    <div class="icons">
      <i class="fa-solid fa-magnifying-glass" style="color: #ffffff;"></i>
      <i class="fa-solid fa-user" style="color: #ffffff;"></i>
      <i class="fa-regular fa-heart" style="color: #ffffff;"></i>
      <i class="fa-solid fa-cart-shopping" style="color: #ffffff;"></i>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-text">
        <h1>Sabores do Japão na sua mesa em poucos cliques</h1>
        <p>Experimente nossa autêntica culinária japonesa com ingredientes frescos e receitas tradicionais. Delivery
          rápido e seguro direto na sua casa!</p>
        <button class="order-now">Faça seu pedido</button>
      </div>
  </main>

  <div class="container-cardapio">
        <h1 class="titulo">Cardápio</h1>
        
        <div class="cards">
            <div class="card">
                <div class="card-image">
                    <img src="./src_/img_/img01.jpg" alt="À la carte">
                </div>
                <div class="card-content">
                    <h3 class="card1-title">À la carte</h3>
                </div>
            </div>
            
            <div class="card">
                <div class="card-image">
                    <img src="./src_/img_/img02.jpg" alt="Rodízio">
                </div>
                <div class="card-content">
                    <h3 class="card-title">Rodízio</h3>
                </div>
            </div>
            
            <div class="card">
                <div class="card-image">
                    <img src="./src_/img_/img03.jpg" alt="Menu executivo">
                </div>
                <div class="card-content">
                    <h3 class="card-title">Menu executivo</h3>
                </div>
            </div>
            
            <div class="card">
                <div class="card-image">
                    <img src="./src_/img_/img04.jpg" alt="Bebidas">
                </div>
                <div class="card-content">
                    <h3 class="card-Titulo">Bebidas</h3>
                </div>
            </div>
        </div>
    </div>


</body>

</html>

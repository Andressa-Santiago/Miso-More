<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miso & More</title>

  <!-- Logo -->
  <link rel="shortcut icon" href="../src_/img_/hashi.png" type="image/x-icon">

  <!-- link css -->
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/galeria.css">

  <!-- link font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- links -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- link fonte josefin sans -->
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <!-- link bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
  <!-- menu -->
  <header>
    <nav class="navbar navbar-expand-lg w-100">
      <div class="container-fluid">
        <div class="logo" id="topo">
          <img src="../img_/logoMiso.png" alt="Miso & More Logo" loading="lazy" decoding="async">
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <i class="fa-solid fa-bars" style="color: #ffffff;"></i>
        </button>

        <div class="collapse navbar-collapse justify-content-center text-center p-1" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a href="./index.html" class="nav-link text-white" aria-current="page">Home</a></li>
            <li class="nav-item"><a href="./src_/HTML/cardapio.html" class="nav-link text-white">Cardápio</a></li>
            <li class="nav-item"><a href="./src_/HTML/quemSomos.html" class="nav-link text-white">Quem somos</a></li>
            <li class="nav-item"><a href="./src_/HTML/contato.html" class="nav-link text-white">Contato</a></li>
            <li class="nav-item"><a href="./src_/HTML/galeria.html" class="nav-link text-white">Galeria</a></li>
          </ul>
        </div>

        <!-- barra de pesquisa -->
        <div class="icons d-none d-md-none d-lg-block" style="position: relative;">
          <form class="form-inline my-2 my-lg-0">
            <div style="position: relative;">
              <input class="form-control" type="search" placeholder="Pesquisar" aria-label="Pesquisar"
                style="padding-right: 32px; width: 220px;">
              <span
                style="position: absolute; top: 50%; right: 8px; transform: translateY(-50%); pointer-events: none;">
                <i class="fa-solid fa-magnifying-glass" style="color: #e63946; font-size: 22px;"></i>
              </span>
            </div>
          </form>
        </div>
        <!-- fim barra de pesquisa -->
      </div>
    </nav>
  </header>
  <!-- fim menu -->

  <!-- main -->
  <main>
    <section>
      <div class="gallery-container">
          <h1 class="gallery-title">Galeria de imagem</h1>
          
          <div class="container-fluid">
              <div class="row g-4">
                  <!-- Primeira linha -->
                  <div class="col-12 col-sm-6 col-md-4">
                      <div class="gallery-item">
                          <img src="../img_/" alt="Imagem 1">
                      </div>
                  </div>
                  <div class="col-12 col-sm-6 col-md-4">
                      <div class="gallery-item">
                          <img src="imagem2.jpg" alt="Imagem 2">
                      </div>
                  </div>
                  <div class="col-12 col-sm-6 col-md-4">
                      <div class="gallery-item">
                          <img src="imagem3.jpg" alt="Imagem 3">
                      </div>
                  </div>
  
                  <!-- Segunda linha -->
                  <div class="col-12 col-sm-6 col-md-4">
                      <div class="gallery-item">
                          <img src="imagem4.jpg" alt="Imagem 4">
                      </div>
                  </div>
                  <div class="col-12 col-sm-6 col-md-4">
                      <div class="gallery-item">
                          <img src="imagem5.jpg" alt="Imagem 5">
                      </div>
                  </div>
                  <div class="col-12 col-sm-6 col-md-4">
                      <div class="gallery-item">
                          <img src="imagem6.jpg" alt="Imagem 6">
                      </div>
                  </div>
  
                  <!-- Terceira linha -->
                  <div class="col-12 col-sm-6 col-md-4">
                      <div class="gallery-item">
                          <img src="imagem7.jpg" alt="Imagem 7">
                      </div>
                  </div>
                  <div class="col-12 col-sm-6 col-md-4">
                      <div class="gallery-item">
                          <img src="imagem8.jpg" alt="Imagem 8">
                      </div>
                  </div>
                  <div class="col-12 col-sm-6 col-md-4">
                      <div class="gallery-item">
                          <img src="imagem9.jpg" alt="Imagem 9">
                      </div>
                  </div>
              </div>
          </div>
      </div>
    </section>
  </main>
  <!-- fim main -->

   <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
